<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>OREMIT | Under Construction</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    main { max-width: 520px; }
    .icon { font-size: 3.5rem; margin-bottom: 1rem; }
    h1 { font-size: clamp(1.8rem, 4vw, 2.5rem); margin-bottom: .75rem; }
    p { color: #94a3b8; line-height: 1.6; margin-bottom: 1.5rem; }
    .bar {
      height: 8px; background: #1e293b; border-radius: 999px; overflow: hidden; margin: 1.5rem 0 .5rem;
    }
    .bar span {
      display: block; height: 100%; width: 60%;
      background: linear-gradient(90deg, #38bdf8, #6366f1);
      border-radius: 999px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: .6; }
      50% { opacity: 1; }
    }
    .small { font-size: .85rem; color: #64748b; }
    .marker { font-family: ui-monospace, Menlo, monospace; font-size: .75rem; color: #475569; margin-top: 2rem; }
    @media (prefers-reduced-motion: reduce) { .bar span { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">🚧</div>
    <h1>Sedang dalam pengembangan</h1>
    <p>
      Website OREMIT sedang kami siapkan. Halaman lengkap akan segera hadir.
      Terima kasih atas kesabaran Anda.
    </p>
    <div class="bar" role="progressbar" aria-label="Progres pengembangan" aria-valuetext="Sedang berjalan">
      <span></span>
    </div>
    <p class="small">Sedang dalam proses pengerjaan.</p>
    <p class="marker">oremit-underconstruction</p>
  </main>
</body>
</html>
